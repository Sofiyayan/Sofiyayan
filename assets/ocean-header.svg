    <use href="#w" fill="#4facfe" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="-375 0" to="-1125 0" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(0,135)">
    <use href="#w" fill="#146c94">
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="-950 0" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>
  <rect y="200" width="1000" height="20" fill="#146c94"/>
</svg>
